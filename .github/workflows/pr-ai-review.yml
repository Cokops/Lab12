name: AI Pull Request Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Generate AI description and review
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      shell: python
      run: |
        import os
        import sys
        import requests
        import json
        import subprocess

        # Get PR details
        pr_number = os.environ['PR_NUMBER']
        repo = os.environ['REPO']
        
        # Get diff from PR
        try:
            result = subprocess.run(
                ['gh', 'pr', 'diff', pr_number, '--repo', repo],
                capture_output=True,
                text=True,
                check=True
            )
            diff = result.stdout
        except subprocess.CalledProcessError as e:
            print(f"Error getting PR diff: {e.stderr}")
            sys.exit(1)

        if not diff.strip():
            print("No changes found in PR")
            sys.exit(0)

        # Limit diff size for API
        if len(diff) > 8000:
            diff = diff[:8000] + "\n... (diff truncated due to size)"

        # Prepare AI prompt
        prompt = f"""Analyze the following code changes and provide:
        1. A concise summary of the changes (2-3 sentences)
        2. Potential issues or improvements (security, performance, style, bugs)
        
        Changes:
        {diff}"""

        # Call OpenAI API
        headers = {
            "Authorization": f"Bearer {os.environ['OPENAI_API_KEY']}",
            "Content-Type": "application/json"
        }
        
        data = {
            "model": "gpt-4o-mini",
            "messages": [
                {
                    "role": "system", 
                    "content": "You are a senior Python developer reviewing code changes. Be concise, constructive, and specific. Format your response in Markdown."
                },
                {
                    "role": "user", 
                    "content": prompt
                }
            ],
            "temperature": 0.3,
            "max_tokens": 1000
        }

        print("🤖 Sending request to OpenAI API...")
        
        try:
            response = requests.post(
                "https://api.openai.com/v1/chat/completions",
                headers=headers,
                json=data,
                timeout=30
            )
            response.raise_for_status()
            ai_response = response.json()['choices'][0]['message']['content']
            print("✅ Received AI response")
        except requests.exceptions.RequestException as e:
            print(f"❌ OpenAI API error: {e}")
            if hasattr(e, 'response') and e.response:
                print(f"Response: {e.response.text}")
            sys.exit(1)

        # Post comment on PR
        comment_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
        comment_body = f"""## 🤖 AI Code Review

        {ai_response}

        ---
        *Automated review generated by OpenAI GPT-4o-mini*"""
        
        comment_data = {"body": comment_body}
        
        github_headers = {
            "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"
        }

        print("📝 Posting comment to PR...")
        
        try:
            comment_response = requests.post(
                comment_url,
                headers=github_headers,
                json=comment_data,
                timeout=15
            )
            comment_response.raise_for_status()
            print("✅ Comment posted successfully!")
            print(f"Comment URL: {comment_response.json()['html_url']}")
        except requests.exceptions.RequestException as e:
            print(f"❌ Error posting comment: {e}")
            if hasattr(e, 'response') and e.response:
                print(f"Response: {e.response.text}")
            sys.exit(1)