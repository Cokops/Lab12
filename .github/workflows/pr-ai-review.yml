name: AI Pull Request Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      models: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install azure-ai-inference
        pip install azure-core

    - name: Generate AI review with GitHub Models
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      shell: python
      run: |
        import os
        import sys
        import subprocess
        import requests
        from azure.ai.inference import ChatCompletionsClient
        from azure.ai.inference.models import SystemMessage, UserMessage
        from azure.core.credentials import AzureKeyCredential

        github_token = os.environ.get('GITHUB_TOKEN')
        if not github_token:
            print("GITHUB_TOKEN not found")
            sys.exit(1)

        endpoint = "https://models.inference.ai.azure.com"
        client = ChatCompletionsClient(
            endpoint=endpoint,
            credential=AzureKeyCredential(github_token),
        )

        pr_number = os.environ['PR_NUMBER']
        repo = os.environ['REPO']

        try:
            result = subprocess.run(
                ['gh', 'pr', 'diff', pr_number, '--repo', repo],
                capture_output=True,
                text=True,
                check=True
            )
            diff = result.stdout
        except subprocess.CalledProcessError as e:
            print(f"Error getting PR diff: {e.stderr}")
            sys.exit(1)

        if not diff.strip():
            print("No changes found in PR")
            sys.exit(0)

        if len(diff) > 8000:
            diff = diff[:8000] + "\n... (diff truncated)"

        model_name = "gpt-4o-mini"

        prompt = "Analyze the following code changes and provide:\n1. A concise summary of the changes (2-3 sentences)\n2. Potential issues or improvements (security, performance, style, bugs)\n\nChanges:\n" + diff

        print(f"Sending request to GitHub Models ({model_name})...")

        try:
            response = client.complete(
                messages=[
                    SystemMessage(content="You are a senior Python developer reviewing code changes. Be concise, constructive, and specific."),
                    UserMessage(content=prompt),
                ],
                model=model_name,
                temperature=0.3,
                max_tokens=1000,
            )
            ai_response = response.choices[0].message.content
            print("Received AI response from GitHub Models")
        except Exception as e:
            print(f"GitHub Models API error: {e}")
            sys.exit(1)

        comment_body = "## AI Code Review (Powered by GitHub Models)\n\n" + ai_response + "\n\n---\n*Automated review generated by GitHub Models*\n*Free tier: 150 requests/day*"

        github_headers = {
            "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
            "Accept": "application/vnd.github+json",
        }

        comment_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"

        print("Posting comment to PR...")

        try:
            comment_response = requests.post(
                comment_url,
                headers=github_headers,
                json={"body": comment_body},
                timeout=15
            )
            comment_response.raise_for_status()
            print("Comment posted successfully!")
        except Exception as e:
            print(f"Error posting comment: {e}")
            sys.exit(1)