name: AI Pull Request Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-generativeai

    - name: Generate AI description and review with Gemini
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      shell: python
      run: |
        import os
        import sys
        import subprocess
        import google.generativeai as genai

        # Configure Gemini
        api_key = os.environ.get('GOOGLE_API_KEY')
        if not api_key:
            print("❌ GOOGLE_API_KEY not found in secrets")
            sys.exit(1)
        
        genai.configure(api_key=api_key)

        # Get PR details
        pr_number = os.environ['PR_NUMBER']
        repo = os.environ['REPO']
        
        # Get diff from PR
        try:
            result = subprocess.run(
                ['gh', 'pr', 'diff', pr_number, '--repo', repo],
                capture_output=True,
                text=True,
                check=True
            )
            diff = result.stdout
        except subprocess.CalledProcessError as e:
            print(f"Error getting PR diff: {e.stderr}")
            sys.exit(1)

        if not diff.strip():
            print("No changes found in PR")
            sys.exit(0)

        # Limit diff size for API
        if len(diff) > 30000:
            diff = diff[:30000] + "\n... (diff truncated due to size)"

        # Prepare AI prompt
        prompt = f"""Analyze the following code changes and provide:
        1. A concise summary of the changes (2-3 sentences)
        2. Potential issues or improvements (security, performance, style, bugs)

        Changes:
        {diff}"""

        # Use Gemini model
        model = genai.GenerativeModel('gemini-2.0-flash-lite')
        
        print("🤖 Sending request to Google Gemini API...")
        
        try:
            response = model.generate_content(
                prompt,
                generation_config={
                    "temperature": 0.3,
                    "max_output_tokens": 1000,
                }
            )
            ai_response = response.text
            print("✅ Received AI response from Gemini")
        except Exception as e:
            print(f"❌ Gemini API error: {e}")
            sys.exit(1)

        # Post comment on PR
        comment_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
        comment_body = "## 🤖 AI Code Review (Powered by Google Gemini)\n\n" + ai_response + "\n\n---\n*Automated review generated by Google Gemini 2.0 Flash Lite*\n*Free tier: 500 requests/day*"
        
        comment_data = {"body": comment_body}
        
        github_headers = {
            "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"
        }

        print("📝 Posting comment to PR...")
        
        try:
            import requests
            comment_response = requests.post(
                comment_url,
                headers=github_headers,
                json=comment_data,
                timeout=15
            )
            comment_response.raise_for_status()
            print("✅ Comment posted successfully!")
            print(f"Comment URL: {comment_response.json()['html_url']}")
        except Exception as e:
            print(f"❌ Error posting comment: {e}")
            sys.exit(1)