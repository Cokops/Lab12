name: AI Pull Request Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      models: read               # ← ГЛАВНОЕ: разрешение на доступ к GitHub Models

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests azure-ai-inference

    - name: Generate AI review with GitHub Models
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      shell: python
      run: |
        import os
        import sys
        import subprocess
        import requests
        from azure.ai.inference import ChatCompletionsClient
        from azure.ai.inference.models import SystemMessage, UserMessage
        from azure.core.credentials import AzureKeyCredential

        # === 1. Настройка клиента GitHub Models ===
        github_token = os.environ.get('GITHUB_TOKEN')
        if not github_token:
            print("❌ GITHUB_TOKEN not found")
            sys.exit(1)

        endpoint = "https://models.inference.ai.azure.com"
        client = ChatCompletionsClient(
            endpoint=endpoint,
            credential=AzureKeyCredential(github_token),
        )

        # === 2. Получение PR details ===
        pr_number = os.environ['PR_NUMBER']
        repo = os.environ['REPO']

        # Get diff from PR
        try:
            result = subprocess.run(
                ['gh', 'pr', 'diff', pr_number, '--repo', repo],
                capture_output=True,
                text=True,
                check=True
            )
            diff = result.stdout
        except subprocess.CalledProcessError as e:
            print(f"Error getting PR diff: {e.stderr}")
            sys.exit(1)

        if not diff.strip():
            print("No changes found in PR")
            sys.exit(0)

        # Limit diff size
        if len(diff) > 8000:
            diff = diff[:8000] + "\n... (diff truncated)"

        # === 3. Отправка запроса к модели ===
        # Можно выбрать любую модель из списка ниже
        # Популярные варианты:
        # - "gpt-4o-mini" (OpenAI, быстрая и качественная)
        # - "Meta-Llama-3.1-8B-Instruct" (Meta, хороший вариант)
        # - "Mistral-small" (Mistral AI)
        model_name = "gpt-4o-mini"

        prompt = f"""Analyze the following code changes and provide:
1. A concise summary of the changes (2-3 sentences)
2. Potential issues or improvements (security, performance, style, bugs)

Changes:
{diff}"""

        print(f"🤖 Sending request to GitHub Models ({model_name})...")

        try:
            response = client.complete(
                messages=[
                    SystemMessage(content="You are a senior Python developer reviewing code changes. Be concise, constructive, and specific."),
                    UserMessage(content=prompt),
                ],
                model=model_name,
                temperature=0.3,
                max_tokens=1000,
            )
            ai_response = response.choices[0].message.content
            print("✅ Received AI response from GitHub Models")
        except Exception as e:
            print(f"❌ GitHub Models API error: {e}")
            sys.exit(1)

        # === 4. Публикация комментария ===
        comment_body = f"""## 🤖 AI Code Review (Powered by GitHub Models - {model_name})

{ai_response}

---
*Automated review generated by GitHub Models*
*Free tier: 150 requests/day | Rate limits apply*"""

        github_headers = {
            "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"
        }

        comment_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"

        print("📝 Posting comment to PR...")

        try:
            comment_response = requests.post(
                comment_url,
                headers=github_headers,
                json={"body": comment_body},
                timeout=15
            )
            comment_response.raise_for_status()
            print("✅ Comment posted successfully!")
            print(f"Comment URL: {comment_response.json()['html_url']}")
        except Exception as e:
            print(f"❌ Error posting comment: {e}")
            sys.exit(1)