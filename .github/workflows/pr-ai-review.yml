name: AI Pull Request Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Generate AI description and review
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        import os
        import requests
        import json
        import subprocess
        
        # Get PR details
        pr_number = ${{ github.event.number }}
        repo = ${{ github.repository }}
        
        # Get diff
        diff = subprocess.check_output(['git', 'diff', 'HEAD', 'HEAD~']).decode('utf-8')
        
        if not diff.strip():
            diff = subprocess.check_output(['git', 'diff', 'HEAD']).decode('utf-8')
        
        # Prepare AI prompt
        prompt = f"""Analyze the following code changes and provide:
        1. A concise summary of the changes
        2. Potential issues or improvements (security, performance, style)
        
        Changes:\n{diff}\n"""
        
        # Call OpenAI API
        headers = {
            "Authorization": f"Bearer {os.environ['OPENAI_API_KEY']}",
            "Content-Type": "application/json"
        }
        
        data = {
            "model": "gpt-3.5-turbo",
            "messages": [
                {"role": "system", "content": "You are a senior Python developer reviewing code changes. Be concise and constructive."},
                {"role": "user", "content": prompt}
            ],
            "temperature": 0.7
        }
        
        response = requests.post("https://api.openai.com/v1/chat/completions", headers=headers, data=json.dumps(data))
        
        if response.status_code == 200:
            ai_response = response.json()['choices'][0]['message']['content']
            
            # Post comment on PR
            comment_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
            comment_data = {"body": f"## AI Code Review\n\n{ai_response}"}
            
            requests.post(
                comment_url,
                headers={"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}", "Content-Type": "application/json"},
                data=json.dumps(comment_data)
            )
        else:
            print(f"Error: {response.status_code} - {response.text}")
            exit(1)